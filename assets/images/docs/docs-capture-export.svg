<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu de l’enregistrement et de l’export dans Luma Studio</title>
  <desc id="desc">Barre d’actions de Luma Studio avec les commandes ouvrir, enregistrer et exporter, ainsi qu’un panneau de formats de sortie.</desc>
